name: Build & Submit to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Local iOS Build & TestFlight Submit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple requires iOS 26 SDK (Xcode 26) for uploads starting
      # April 28, 2026. The default Xcode on macos-latest may still be
      # 16.x, so we pin it explicitly. Bump the minor as Apple ships
      # security updates; `26` selects the newest 26.x on the runner.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Decode App Store Connect API Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Handle 3 storage formats for the secret:
          #   1. Raw PEM text  (starts with -----BEGIN PRIVATE KEY-----)
          #   2. base64 of PEM (most common — decode → PEM)
          #   3. base64 of DER (binary) — decode → convert DER→PEM via openssl
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "Secret is raw PEM, writing as-is."
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            echo "Secret looks like base64, decoding."
            printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -D > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          # If the result still isn't PEM, try DER→PEM conversion (openssl pkcs8).
          if ! head -c 40 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "Decoded content is not PEM — attempting DER→PEM conversion."
            tmp_pem="${KEY_PATH}.pem"
            if openssl pkcs8 -inform DER -in "$KEY_PATH" -out "$tmp_pem" -nocrypt 2>/dev/null \
               && grep -q "BEGIN PRIVATE KEY" "$tmp_pem"; then
              mv "$tmp_pem" "$KEY_PATH"
              echo "DER→PEM conversion succeeded."
            else
              rm -f "$tmp_pem"
              echo "::error::Could not decode ASC_API_KEY_P8 as PEM or DER. First bytes were:"
              head -c 40 "$KEY_PATH" | xxd | head -2
              echo "Re-export your .p8 from App Store Connect and store its full PEM text as the secret."
              exit 1
            fi
          fi
          echo "✓ AuthKey_${ASC_KEY_ID}.p8 ready ($(wc -c < "$KEY_PATH") bytes)."

      - name: Patch CocoaPods xcodeproj for Xcode 26 (objectVersion 70)
        # Expo SDK 54 + Xcode 26 emit an iOS project at objectVersion 70
        # (PBXFileSystemSynchronizedRootGroup). The latest published xcodeproj
        # gem (1.27.0, bundled by CocoaPods) has no mapping for 70 → pod install
        # dies with "compatibility version string for object version 70". Teach
        # it 70 = Xcode 16.0. Idempotent + no-op if the runner already knows 70.
        run: |
          set -uo pipefail
          patched=0
          patch_file() {
            f="$1"
            [ -f "$f" ] || return 0
            if grep -q "70 => " "$f"; then patched=1; return 0; fi
            perl -0777 -i -pe "s/(77 => 'Xcode 16\.0',\n)/\${1}      70 => 'Xcode 16.0',\n/" "$f"
            if grep -q "70 => " "$f"; then echo "patched $f"; patched=1; fi
          }
          active=$(ruby -rxcodeproj -e "puts File.join(Gem.loaded_specs['xcodeproj'].full_gem_path,'lib/xcodeproj/constants.rb')" 2>/dev/null || true)
          [ -n "$active" ] && patch_file "$active"
          for d in "$(gem env gemdir 2>/dev/null)" /usr/local/lib/ruby/gems /opt/homebrew/lib/ruby/gems "$HOME/.gem/ruby" /Library/Ruby/Gems; do
            [ -d "$d" ] || continue
            while IFS= read -r f; do patch_file "$f"; done < <(find "$d" -path '*/xcodeproj-*/lib/xcodeproj/constants.rb' 2>/dev/null)
          done
          if [ "$patched" = "1" ]; then echo "xcodeproj supports objectVersion 70"; else echo "::warning::no xcodeproj constants.rb patched (already supports 70, or not found yet)"; fi

      - name: Build iOS locally (no cloud credits)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # AssemblyAI, Anthropic, OpenAI and Google Places are all called
          # SERVER-SIDE now (assemblyai-transcribe / ai-chat / whisper-transcribe
          # edge functions hold the keys as non-public Deno secrets), so no AI
          # provider key is injected into the client bundle anymore.
          # ASC API key lets EAS auto-provision App IDs + Provisioning Profiles
          # for new targets (e.g. widget extensions) without an interactive prompt.
          EXPO_ASC_API_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: eas build --platform ios --profile production --non-interactive --local --output ${{ github.workspace }}/build.ipa

      - name: Save .ipa as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: ${{ github.workspace }}/build.ipa
          retention-days: 7

      - name: Upload to TestFlight via altool
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ${{ github.workspace }}/build.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --verbose
