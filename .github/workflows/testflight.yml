name: Build & Submit to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Local iOS Build & TestFlight Submit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple requires iOS 26 SDK (Xcode 26) for uploads starting
      # April 28, 2026. The default Xcode on macos-latest may still be
      # 16.x, so we pin it explicitly. Bump the minor as Apple ships
      # security updates; `26` selects the newest 26.x on the runner.
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS locally (no cloud credits)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.EXPO_PUBLIC_ANTHROPIC_API_KEY }}
          EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          EXPO_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_PLACES_API_KEY }}
        run: eas build --platform ios --profile production --non-interactive --local --output ${{ github.workspace }}/build.ipa

      - name: Save .ipa as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: ${{ github.workspace }}/build.ipa
          retention-days: 7

      - name: Decode App Store Connect API Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Strip every whitespace byte (spaces, tabs, CR, LF) and decode.
          # Using printf + env var instead of `echo "${{ secrets.X }}"`
          # because GitHub's shell expansion can mangle multi-line secrets.
          printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Fail fast if the decoded file isn't a valid PEM — gives a clear
          # error right here instead of a cryptic JWT failure in altool.
          if ! head -n 1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::Decoded .p8 is not a valid PEM. First line was:"
            head -n 1 "$KEY_PATH"
            echo "Check the ASC_API_KEY_P8 secret — it must be the base64 of a raw .p8 file (no PEM headers, no extra whitespace)."
            exit 1
          fi
          echo "✓ AuthKey_${ASC_KEY_ID}.p8 decoded ($(wc -c < "$KEY_PATH") bytes)."

      - name: Upload to TestFlight via altool
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file ${{ github.workspace }}/build.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --verbose
