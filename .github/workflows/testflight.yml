name: Build & Submit to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Local iOS Build & TestFlight Submit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS locally (no cloud credits)
        run: eas build --platform ios --profile production --non-interactive --local --output ${{ github.workspace }}/build.ipa

      - name: Submit to TestFlight
        run: eas submit --platform ios --path ${{ github.workspace }}/build.ipa --non-interactive
