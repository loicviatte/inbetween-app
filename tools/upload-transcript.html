<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Transcript</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D0D12;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 640px; }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 32px; }

    .card {
      background: #18181F;
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-of-type { margin-top: 0; }
    input, select, textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(255,157,0,0.5);
    }
    textarea { resize: vertical; min-height: 200px; line-height: 1.5; }
    select option { background: #18181F; }

    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0; }
    .pill {
      padding: 8px 16px;
      border-radius: 20px;
      border: 0.5px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill.active {
      background: #FF9D00;
      border-color: #FF9D00;
      color: #0D0D12;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 8px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #FF9D00; color: #0D0D12; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; margin-top: 16px; }
    .btn:not(:disabled):hover { opacity: 0.85; }

    .status {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      display: none;
    }
    .status.success { background: rgba(76,175,80,0.15); color: #4CAF50; border: 0.5px solid rgba(76,175,80,0.3); }
    .status.error   { background: rgba(232,64,64,0.15);  color: #E84040; border: 0.5px solid rgba(232,64,64,0.3); }
    .status.info    { background: rgba(255,157,0,0.12);  color: #FF9D00; border: 0.5px solid rgba(255,157,0,0.3); }

    #login-view, #form-view { display: none; }
    #login-view.active, #form-view.active { display: block; }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .user-bar .name { font-weight: 600; color: #fff; }
    .user-bar .logout { color: rgba(255,255,255,0.35); cursor: pointer; font-size: 12px; text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #0D0D12;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <h1>Upload Transcript</h1>
  <p class="sub">Manually create a class_input → triggers yoda-extract automatically</p>

  <!-- Login -->
  <div id="login-view">
    <div class="card">
      <div class="section-title">Sign in as coach</div>
      <label>Email</label>
      <input type="email" id="email" placeholder="coach@example.com" />
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
      <button class="btn btn-primary" id="login-btn" onclick="login()" style="margin-top:20px">Sign in</button>
      <div class="status" id="login-status"></div>
    </div>
  </div>

  <!-- Form -->
  <div id="form-view">
    <div class="user-bar">
      <span class="name" id="user-label">—</span>
      <span class="logout" onclick="logout()">Log out</span>
    </div>

    <div class="card">
      <div class="section-title">Class info</div>

      <label>Lesson type</label>
      <div class="pill-row" id="lesson-type-pills">
        <button class="pill active" data-val="private" onclick="selectPill('lesson-type-pills', this)">Private</button>
        <button class="pill" data-val="public" onclick="selectPill('lesson-type-pills', this)">Group</button>
      </div>

      <label>Dance</label>
      <select id="dance">
        <option value="">— select —</option>
        <option>Cha Cha</option>
        <option>Samba</option>
        <option>Rumba</option>
        <option>Paso Doble</option>
        <option>Jive</option>
        <option>Waltz</option>
        <option>Tango</option>
        <option>V. Waltz</option>
        <option>Foxtrot</option>
        <option>Quickstep</option>
      </select>

      <label>Student (for private lessons)</label>
      <select id="student-select">
        <option value="">— loading students… —</option>
      </select>

      <label>Teacher name (optional)</label>
      <input type="text" id="teacher-name" placeholder="e.g. Marius" />
    </div>

    <div class="card">
      <div class="section-title">Transcript</div>
      <textarea id="transcript" placeholder="[00:00 - 00:30] Speaker A: OK so today we're going to focus on...&#10;[00:30 - 01:15] Speaker A: Your hip action needs more settle on each weight transfer..."></textarea>
    </div>

    <button class="btn btn-primary" id="submit-btn" onclick="submit()">
      Submit & trigger extraction
    </button>
    <div class="status" id="form-status"></div>
  </div>
</div>

<script>
  const SUPABASE_URL  = 'https://hhhvsjpgiehljfktevns.supabase.co'
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoaHZzanBnaWVobGpma3Rldm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODIwNzQsImV4cCI6MjA4OTc1ODA3NH0.hfm6MCkVuPW0DU6-zcSrTTHpCiXIEIw9o4zN8AUhqGE'

  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_ANON)

  let currentUser = null

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await db.auth.getSession()
    if (session?.user) {
      await onSignedIn(session.user)
    } else {
      showView('login')
    }
  }

  async function onSignedIn(user) {
    currentUser = user
    showView('form')
    document.getElementById('user-label').textContent = user.email
    await loadStudents(user.id)
  }

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function login() {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const btn = document.getElementById('login-btn')
    const st = document.getElementById('login-status')

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span>Signing in…'
    hideStatus(st)

    const { data, error } = await db.auth.signInWithPassword({ email, password })
    if (error) {
      showStatus(st, 'error', error.message)
      btn.disabled = false
      btn.textContent = 'Sign in'
      return
    }
    await onSignedIn(data.user)
  }

  async function logout() {
    await db.auth.signOut()
    currentUser = null
    showView('login')
  }

  // ── Students ──────────────────────────────────────────────────────────────
  async function loadStudents(coachId) {
    const sel = document.getElementById('student-select')
    sel.innerHTML = '<option value="">— no student (group) —</option>'

    const { data, error } = await db
      .from('coach_requests')
      .select('student_id, users!coach_requests_student_id_fkey(id, name)')
      .eq('coach_id', coachId)
      .eq('status', 'accepted')

    if (error || !data?.length) {
      sel.innerHTML = '<option value="">— no linked students —</option>'
      return
    }

    for (const r of data) {
      const u = r.users
      if (!u) continue
      const opt = document.createElement('option')
      opt.value = u.id
      opt.textContent = u.name || u.id
      sel.appendChild(opt)
    }
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  async function submit() {
    const transcript = document.getElementById('transcript').value.trim()
    const dance      = document.getElementById('dance').value
    const teacherName = document.getElementById('teacher-name').value.trim()
    const studentId  = document.getElementById('student-select').value
    const lessonType = document.querySelector('#lesson-type-pills .pill.active')?.dataset.val ?? 'private'
    const st = document.getElementById('form-status')
    const btn = document.getElementById('submit-btn')

    if (!transcript) { showStatus(st, 'error', 'Transcript is required.'); return }
    if (lessonType === 'private' && !studentId) { showStatus(st, 'error', 'Select a student for a private lesson.'); return }

    btn.disabled = true
    btn.innerHTML = '<span class="spinner"></span>Inserting…'
    hideStatus(st)

    const row = {
      user_id:      currentUser.id,
      lesson_type:  lessonType,
      transcript,
      status:       'pending',
      practice_point_1: '…',   // placeholder — yoda-extract will overwrite
    }
    if (dance)       row.dance        = dance
    if (teacherName) row.teacher_name = teacherName
    if (studentId && lessonType === 'private') row.student_id = studentId

    const { data, error } = await db.from('class_inputs').insert(row).select('id').single()

    btn.disabled = false
    btn.textContent = 'Submit & trigger extraction'

    if (error) {
      showStatus(st, 'error', `Insert failed: ${error.message}`)
      return
    }

    showStatus(st, 'success',
      `✓ class_input created (${data.id})\n\nyoda-extract has been triggered via webhook. Focus points will be created within ~30s and appear in pending_coach status for the coach to review.`
    )
    document.getElementById('transcript').value = ''
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function showView(name) {
    document.getElementById('login-view').classList.toggle('active', name === 'login')
    document.getElementById('form-view').classList.toggle('active', name === 'form')
  }

  function selectPill(groupId, el) {
    document.querySelectorAll(`#${groupId} .pill`).forEach(p => p.classList.remove('active'))
    el.classList.add('active')
  }

  function showStatus(el, type, msg) {
    el.className = `status ${type}`
    el.style.display = 'block'
    el.textContent = msg
  }
  function hideStatus(el) { el.style.display = 'none' }

  init()
</script>
</body>
</html>
